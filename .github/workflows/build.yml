# Builds the Windows host and the Android app on every push / pull request and keeps the results
# as downloadable artifacts. Releases are made by hand from these artifacts.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    # After the app: the Windows package and the installer carry PadDisplay.apk.
    needs: android
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # host/third_party/padmic (acxmic): the host needs its header
      - uses: actions/download-artifact@v4
        with:
          name: PadDisplay-android
          path: android/app/build/outputs/apk/release
      - name: Build host, installer and portable zip (VS 2022, CMake, Ninja, Inno Setup)
        shell: cmd
        run: host\installer\build-installer.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: PadDisplay-windows
          path: host/dist/PadDisplay/
      - uses: actions/upload-artifact@v4
        with:
          name: PadDisplay-windows-installer
          path: host/dist/PadDisplay-Setup-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Drop the action's default 'tools' package: Google removed the legacy SDK "tools" package, so
          # "sdkmanager tools" now fails. Gradle downloads the platform and build-tools it needs by itself
          # under the licenses this action accepts. Keep the log quiet (it otherwise prints every license).
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PadDisplay-android
          path: android/app/build/outputs/apk/release/*.apk
